<!doctype html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Milliy Me'mor — Admin</title>
    <style>
        body {
            margin: 0;
            background: #070c09;
            color: #eafdf1;
            font-family: system-ui;
            min-height: 100vh;
            display: grid;
            place-items: center
        }

        .panel {
            background: #101c15;
            border: 1px solid #244b34;
            border-radius: 22px;
            padding: 35px;
            width: min(370px, 85vw);
            box-shadow: 0 20px 80px #0009
        }

        h1 {
            font-size: 23px
        }

        small {
            color: #11e88a
        }

        input,
        button {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            margin-top: 13px;
            border-radius: 10px;
            font-size: 15px
        }

        input {
            background: #08130c;
            border: 1px solid #356447;
            color: white
        }

        button {
            background: #09d978;
            color: #03120a;
            border: 0;
            font-weight: 800;
            cursor: pointer
        }

        .error {
            color: #ff9292
        }
    </style>
</head>

<body>
    <main class="panel"><small>🛡 MILLIY ME’MOR GROUP</small>
        <h1>ADMIN CONTROL CENTER</h1>
        <p>Ruxsat berilgan administrator uchun kirish</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form
            method="post" action="/admin/login"><input name="admin_id" placeholder="Telegram raqamli ID" required
                autocomplete="username"><input type="password" name="password" placeholder="Admin parol" required
                autocomplete="current-password"><button>KIRISH →</button></form>
    </main>
</body>

</html>
